<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#0b3558">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="いつなら？">
<title>いつなら？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Calendly design system (Refero) : Ink Navy / Signal Blue / Cloud / Pebble / Hairline */
  :root {
    --navy:#0b3558; --blue:#006bff; --slate:#476788; --mist:#a6bbd1;
    --cloud:#f8f9fb; --paper:#ffffff; --pebble:#f0f3f8; --hair:#d4e0ed; --sky:#e6f0ff; --cobalt:#004eba;
    --shadow: rgba(71,103,136,0.04) 0 4px 5px, rgba(71,103,136,0.03) 0 8px 15px, rgba(71,103,136,0.08) 0 30px 50px;
  }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--cloud); color:var(--navy); font-family:"Manrope","Zen Kaku Gothic New",system-ui,-apple-system,sans-serif; font-weight:500; line-height:1.5; -webkit-text-size-adjust:100%; }
  html { scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
  .wrap { max-width:480px; margin:0 auto; padding:16px 16px 140px; }
  @media (min-width:768px) { .wrap { max-width:640px; padding-top:32px; } }
  .hidden { display:none !important; }
  .brand { display:block; height:36px; width:auto; margin:6px 0 16px; }
  .card { background:var(--paper); border-radius:16px; box-shadow:var(--shadow); padding:20px; margin-bottom:16px; }
  h1 { font-size:24px; font-weight:700; line-height:1.25; margin:0 0 6px; overflow-wrap:anywhere; }
  h2 { font-size:16px; font-weight:700; margin:0 0 12px; }
  .meta { color:var(--slate); font-size:14px; }
  .sub { color:var(--slate); font-size:14px; }

  #whoText { width:100%; box-sizing:border-box; height:48px; padding:0 12px; border:1px solid var(--hair); border-radius:8px; font:inherit; font-size:16px; color:var(--navy); background:var(--paper); margin-bottom:10px; }
  #whoText:focus { outline:none; border-color:var(--blue); }
  .names { display:flex; flex-wrap:wrap; gap:8px; }
  .names button { min-height:48px; padding:0 16px; border:1px solid var(--blue); border-radius:8px; background:#fff; color:var(--blue); font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .names button.sel { background:var(--navy); border-color:var(--navy); color:#fff; }

  /* みんなの重なり：バナー */
  .banner { display:flex; align-items:center; gap:14px; background:var(--navy); color:#fff; border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow); }
  .bn { flex:none; width:64px; height:64px; border-radius:12px; background:var(--blue); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .bn b { font-size:26px; font-weight:800; line-height:1; }
  .bn span { font-size:11px; font-weight:700; line-height:1; margin-top:4px; }
  .bt { min-width:0; }
  .bt .l { font-size:12px; font-weight:700; color:#c9d8ea; }
  .bt .v { font-size:16px; font-weight:800; line-height:1.35; overflow-wrap:anywhere; }
  .bt .s { font-size:12px; color:#c9d8ea; margin-top:2px; overflow-wrap:anywhere; }
  .bt .s:empty { display:none; }

  /* みんなの重なり：カレンダー */
  .cal-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .cal-head h2 { margin:0; }
  .cal-hint { flex:none; font-size:12px; color:var(--slate); }
  .cal-wd, .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-wd span { text-align:center; font-size:11px; font-weight:700; color:var(--slate); padding:4px 0; }
  .cd { height:56px; display:flex; flex-direction:column; align-items:center; padding-top:2px; text-decoration:none; color:var(--navy); }
  .cn { font-style:normal; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#9fb2c6; }
  .cn.long { font-size:11px; }
  .cc { font-size:10px; font-weight:800; line-height:12px; margin-top:2px; }
  .s-all .cn { background:var(--blue); color:#fff; } .s-all .cc { color:var(--blue); }
  .s-wait .cn { background:#fff; box-shadow:inset 0 0 0 1.5px var(--blue); color:var(--blue); } .s-wait .cc { color:var(--blue); }
  .s-tri .cn { background:var(--sky); box-shadow:inset 0 0 0 1.5px var(--cobalt); color:var(--cobalt); } .s-tri .cc { color:var(--cobalt); }
  .s-none .cn { background:var(--pebble); box-shadow:inset 0 0 0 1px var(--mist); color:var(--slate); } .s-none .cc { color:var(--slate); }
  .cd.today .cn { box-shadow:inset 0 0 0 1.5px var(--navy); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:11px; color:var(--slate); }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; }
  .l-all { background:var(--blue); }
  .l-tri { background:var(--sky); box-shadow:inset 0 0 0 1.5px var(--cobalt); }
  .l-wait { background:#fff; box-shadow:inset 0 0 0 1.5px var(--blue); }
  .l-none { background:var(--pebble); box-shadow:inset 0 0 0 1px var(--mist); }

  /* 候補リスト */
  .grp { scroll-margin-top:12px; margin:14px 0 6px; font-size:14px; font-weight:800; color:var(--slate); }
  .grp:first-child { margin-top:0; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px; border-radius:10px; margin-bottom:4px; background:var(--cloud); }
  .srow.all { background:var(--sky); }
  .sl { min-width:0; flex:1; }
  .st { font-size:16px; font-weight:800; line-height:1.3; }
  .pills { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .pill { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px 0 2px; border-radius:999px; background:#fff; box-shadow:inset 0 0 0 1px var(--hair); font-size:12px; font-weight:700; }
  .pc { font-style:normal; width:18px; height:18px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; }
  .pc.me { background:var(--blue); }
  .pm.o { color:var(--blue); } .pm.t { color:var(--cobalt); } .pm.x, .pm.n { color:var(--slate); }
  .seg { display:flex; gap:6px; flex:none; }
  .seg button { width:46px; height:44px; border:1px solid var(--hair); border-radius:8px; background:#fff; color:var(--mist); font:inherit; font-weight:700; font-size:18px; cursor:pointer; padding:0; }
  .seg button.ok.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  .seg button.tri.on { background:var(--sky); border-color:var(--blue); color:var(--cobalt); }
  .seg button.no.on { background:var(--pebble); border-color:var(--pebble); color:var(--slate); }

  textarea { width:100%; border:1px solid var(--hair); border-radius:8px; background:#fff; padding:12px; font:inherit; font-size:15px; color:var(--navy); min-height:64px; resize:vertical; }
  textarea::placeholder { color:var(--mist); }
  .btn { display:block; width:100%; height:52px; border:none; border-radius:8px; background:var(--blue); color:#fff; font:inherit; font-weight:600; font-size:17px; cursor:pointer; text-align:center; line-height:52px; text-decoration:none; }
  .btn:disabled { background:var(--mist); cursor:default; }
  .btn-navy { background:var(--navy); }
  .btn-sub { background:#fff; color:var(--blue); border:1px solid var(--blue); line-height:50px; }
  .help { font-size:13px; color:var(--slate); margin:8px 0 0; }
  .ok-line { color:var(--blue); font-weight:700; font-size:17px; line-height:1.4; margin-bottom:4px; }
  .ok-none { color:var(--slate); font-size:15px; line-height:1.5; }

  .table-wrap { overflow-x:auto; margin:0 -4px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:center; font-weight:600; color:var(--slate); font-size:12px; padding:8px 4px; border-bottom:1px solid var(--hair); white-space:nowrap; }
  th.l { text-align:left; }
  th.me { color:var(--blue); }
  td { text-align:center; padding:10px 4px; border-bottom:1px solid var(--hair); font-weight:700; font-size:18px; }
  td.l { text-align:left; font-size:14px; line-height:1.3; }
  td.l small { display:block; font-weight:500; font-size:12px; color:var(--slate); }
  tr.all td { background:var(--sky); }
  tr.all td:first-child { border-radius:8px 0 0 8px; } tr.all td:last-child { border-radius:0 8px 8px 0; }
  .o { color:var(--blue); } .t { color:var(--cobalt); opacity:.6; } .x { color:var(--mist); } .n { color:var(--hair); }
  .badge { display:inline-block; background:var(--blue); color:#fff; font-size:11px; font-weight:600; padding:1px 8px; border-radius:50px; margin-top:3px; }

  .decided h2 { font-size:22px; margin-bottom:4px; }
  .decided .when { font-size:18px; font-weight:700; margin:8px 0 14px; }
  .decided .when small { display:block; font-weight:500; font-size:14px; color:var(--slate); }
  .closed { text-align:center; padding:48px 0; color:var(--slate); }
  .sk { background:var(--pebble); border-radius:8px; animation:skp 1.2s ease-in-out infinite; }
  .sk + .sk { margin-top:10px; }
  .sk-title { height:26px; width:70%; }
  .notelist { margin:0; padding-left:1.2em; line-height:1.7; }
  .shops { display:grid; grid-template-columns:repeat(3,1fr); gap:12px 10px; }
  .shop { display:block; text-decoration:none; color:inherit; min-width:0; }
  .shop img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; display:block; background:#eee; }
  .shop b { display:block; font-size:13px; line-height:1.3; margin-top:6px; }
  .shop small { display:block; font-size:11px; line-height:1.4; color:#666; margin-top:2px; }
  .sk-meta { height:14px; width:40%; }
  .sk-h { height:18px; width:35%; }
  .sk-box { height:48px; }
  .sk-row { height:40px; }
  @keyframes skp { 0%,100% { opacity:1; } 50% { opacity:.45; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation:none; } }
  .bar { position:fixed; left:0; right:0; bottom:0; z-index:10; background:#fff; border-top:1px solid var(--hair); padding:12px 16px calc(16px + env(safe-area-inset-bottom)); }
  .bar-prog { position:absolute; top:0; left:0; right:0; height:3px; background:var(--pebble); }
  .bar-prog i { display:block; height:100%; width:0; background:var(--blue); transition:width .2s; }
  .bar-in { max-width:480px; margin:0 auto; display:flex; align-items:center; gap:16px; }
  @media (min-width:768px) { .bar-in { max-width:640px; } }
  .bar-cnt { flex:none; line-height:1.2; }
  .bar-n { font-size:20px; font-weight:800; }
  .bar-n span { font-size:13px; font-weight:500; color:var(--slate); }
  .bar-l { font-size:12px; color:var(--slate); }
  .bar .btn { flex:1; width:auto; }
  .toast { z-index:20; position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <img class="brand" src="./wordmark.png" alt="いつなら？">

  <div id="skeleton" aria-hidden="true">
    <div class="card"><div class="sk sk-title"></div><div class="sk sk-meta"></div></div>
    <div class="card"><div class="sk sk-h"></div><div class="sk sk-box"></div></div>
    <div class="card"><div class="sk sk-h"></div><div class="sk sk-row"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div>
  </div>

  <div id="closedBox" class="card closed hidden">この調整は終了しました</div>

  <div id="main" class="hidden">
    <div class="card">
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
    </div>

    <div id="completeBox" class="card hidden">
      <h2>全員の回答がそろいました</h2>
      <div id="completeBody"></div>
      <p class="help">ユウキが枠を確定すると、ここに決定が表示されます</p>
      <button class="btn btn-sub" id="copyBtn" type="button" style="margin-top:14px">結果をコピー</button>
    </div>

    <div id="decidedBox" class="card decided hidden">
      <h2>決まりました</h2>
      <div class="when" id="decidedWhen"></div>
      <a id="decidedLink" class="btn hidden" target="_blank" rel="noopener">リンクを開く</a>
      <a id="decidedCal" class="btn btn-sub hidden" target="_blank" rel="noopener" style="margin-top:10px">自分のGoogleカレンダーに追加</a>
    </div>

    <div id="voteArea" class="hidden">
      <div class="card">
        <h2>あなたの名前</h2>
        <input id="whoText" type="text" placeholder="名前を入力" autocomplete="name">
        <div class="names" id="who"></div>
      </div>
      <div class="banner" id="banner"></div>
      <div class="card hidden" id="calCard">
        <div class="cal-head"><h2 id="calTitle"></h2><span class="cal-hint">日付で一覧へ</span></div>
        <div class="cal-wd"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="legend"><span><i class="l-all"></i>全員○あり</span><span><i class="l-tri"></i>△まで</span><span><i class="l-wait"></i>回答待ち</span><span><i class="l-none"></i>重ならない</span></div>
      </div>
      <div class="card">
        <h2>○ △ × をつける</h2>
        <div id="slots"></div>
      </div>
      <div class="card">
        <textarea id="comment" placeholder="ひとこと（任意）"></textarea>
      </div>
      <div class="bar">
        <div class="bar-prog"><i id="barFill"></i></div>
        <div class="bar-in">
          <div class="bar-cnt"><div class="bar-n"><b id="cnt">0</b><span id="cntTot"> / 0</span></div><div class="bar-l">回答済み</div></div>
          <button class="btn" id="saveBtn" disabled>送信する</button>
        </div>
      </div>
    </div>

    <div id="listBox" class="card hidden">
      <h2>みんなの回答 <span class="sub" id="pending" style="font-weight:500;margin-left:6px"></span></h2>
      <div class="table-wrap" id="matrix"></div>
    </div>

    <div id="noteBox" class="card hidden">
      <h2 id="noteTitle"></h2>
      <div id="noteBody"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="./config.js?v=2"></script>
<script>
  var EVENT = null;
  var myName = null;
  var myMarks = {};
  var VOTES = [];
  var SUMMARY = null;
  var WD = ['日','月','火','水','木','金','土'];

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  // 枠を「日付(曜) / 開始〜終了」に分解。start(ISO)があればそれ、無ければlabelを読む
  function parts(slot) {
    if (slot && slot.start) {
      var s = new Date(slot.start), e = slot.end ? new Date(slot.end) : null;
      if (!isNaN(s.getTime())) {
        return { date: (s.getMonth() + 1) + '/' + s.getDate() + '(' + WD[s.getDay()] + ')',
                 time: pad2(s.getHours()) + ':' + pad2(s.getMinutes()) + (e && !isNaN(e.getTime()) ? '〜' + pad2(e.getHours()) + ':' + pad2(e.getMinutes()) : '') };
      }
    }
    var m = /^\s*(\d{1,2}\/\d{1,2}\s*(?:\([日月火水木金土]\))?)\s*(\d{1,2}:\d{2}(?:\s*[–\-〜~]\s*\d{1,2}:\d{2})?)?/.exec((slot && slot.label) || '');
    if (m && m[2]) return { date: m[1].replace(/\s+/g, ''), time: m[2].replace(/\s*[–\-~]\s*/, '〜') };
    return null;
  }
  function slotLabel(slot) { var p = parts(slot); return p ? p.date + ' ' + p.time : (slot ? slot.label : ''); }

  function computeMatrix(votes, participants, slots) {
    return slots.map(function (slot) {
      var cells = participants.map(function (name) {
        var v = null;
        for (var i = 0; i < votes.length; i++) {
          if (votes[i].name === name && votes[i].slotKey === slot.key) { v = votes[i]; break; }
        }
        return { name: name, mark: v ? v.mark : null };
      });
      var allOk = cells.length > 0 && cells.every(function (c) { return c.mark === '○'; });
      return { key: slot.key, label: slot.label, cells: cells, allOk: allOk };
    });
  }

  function renderMeta() {
    var m = EVENT.meta || {};
    var bits = [EVENT.participants.length + '人'];
    if (m.duration) bits.push(m.duration + '分');
    bits.push(EVENT.slots.length + '候補');
    document.getElementById('meta').textContent = bits.join(' ・ ');
  }

  function renderNote() {
    var note = (EVENT.meta && EVENT.meta.note) || '';
    var lines = note.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) return;
    var title = lines[0].charAt(0) === '#' ? lines.shift().replace(/^#\s*/, '') : '補足';
    document.getElementById('noteTitle').textContent = title;
    var items = lines.map(function (l) {
      var c = l.split('｜'), url = '', img = '';
      if (c.length > 1 && /^https?:\/\//.test(c[c.length - 1])) url = c.pop();
      c = c.filter(function (x) { if (x.indexOf('img=') === 0) { img = x.slice(4); return false; } return true; });
      return { name: c.shift(), meta: c.join(' ・ '), url: url, img: img };
    });
    var box = document.getElementById('noteBody');
    if (items.some(function (it) { return it.img; })) {
      box.className = 'shops';
      box.innerHTML = items.map(function (it) {
        var tag = it.url ? 'a href="' + esc(it.url) + '" target="_blank" rel="noopener"' : 'div';
        return '<' + tag + ' class="shop"><img src="' + esc(it.img) + '" alt="" loading="lazy"><b>' + esc(it.name) + '</b><small>' + esc(it.meta) + '</small></' + (it.url ? 'a' : 'div') + '>';
      }).join('');
    } else {
      box.className = 'notelist';
      box.innerHTML = items.map(function (it) {
        var head = it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.name) + '</a>' : esc(it.name);
        return '<li>' + head + (it.meta ? '<small style="color:#666"> ' + esc(it.meta) + '</small>' : '') + '</li>';
      }).join('');
    }
    document.getElementById('noteBox').classList.remove('hidden');
  }

  function renderWho() {
    var box = document.getElementById('who');
    box.innerHTML = '';
    EVENT.participants.forEach(function (name) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = name;
      b.onclick = function () { selectMe(name, b); };
      box.appendChild(b);
    });
    var text = document.getElementById('whoText');
    if (text && !text.dataset.wired) {
      text.dataset.wired = '1';
      text.addEventListener('input', function () { selectMe(text.value, null); });
    }
  }

  function selectMe(name, btn) {
    name = (name || '').trim();
    if (name !== myName) myMarks = {};
    myName = name;
    Array.prototype.forEach.call(document.querySelectorAll('#who button'), function (x) { x.classList.remove('sel'); });
    if (btn) btn.classList.add('sel');
    var box = document.getElementById('whoText');
    if (box && box.value !== name) box.value = name;
    prefill();
    renderList(VOTES);   // 中で renderBoard() も呼ぶ
    checkSave();
  }

  // 日付キー(YYYY-MM-DD)。start が読めない枠は null
  function slotDate(slot) {
    if (!slot || !slot.start) return null;
    var d = new Date(slot.start);
    return isNaN(d.getTime()) ? null : d;
  }
  function dkey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  // 表示する人: 回答者 → 参加者 → 自分（renderList と同じ並び）
  function boardNames() {
    var names = [];
    VOTES.forEach(function (v) { if (v.name && names.indexOf(v.name) === -1) names.push(v.name); });
    EVENT.participants.forEach(function (n) { if (names.indexOf(n) === -1) names.push(n); });
    if (myName && names.indexOf(myName) === -1) names.push(myName);
    return names;
  }

  // 自分は未送信の myMarks が最優先、無ければ保存済みの票
  function markOf(name, key) {
    if (name === myName && myMarks[key]) return myMarks[key];
    for (var i = 0; i < VOTES.length; i++) {
      if (VOTES[i].name === name && VOTES[i].slotKey === key) return VOTES[i].mark;
    }
    return null;
  }

  // バナー + カレンダー + 候補リストをまとめて描き直す
  function renderBoard() {
    if (!EVENT || EVENT.status === 'decided') return;
    var names = boardNames();
    var info = EVENT.slots.map(function (slot, idx) {
      var all = names.length > 0, tri = names.length > 0, wait = false;
      var marks = names.map(function (n) {
        var m = markOf(n, slot.key);
        if (m !== '○') all = false;
        if (m !== '○' && m !== '△') tri = false;
        if (!m) wait = true;
        return m;
      });
      return { slot: slot, idx: idx, marks: marks, all: all, tri: tri, wait: wait, d: slotDate(slot) };
    });

    // --- バナー ---
    var alls = info.filter(function (x) { return x.all; });
    var late = names.filter(function (n, i) { return info.some(function (x) { return !x.marks[i]; }); });
    var sub = late.length ? '未回答: ' + late.join('、') : (alls.length > 1 ? 'ほか' + (alls.length - 1) + '枠' : '');
    document.getElementById('banner').innerHTML =
      '<div class="bn"><b>' + alls.length + '</b><span>枠</span></div>' +
      '<div class="bt"><div class="l">全員○の枠</div><div class="v">' + (alls.length ? esc(slotLabel(alls[0].slot)) : 'まだありません') + '</div><div class="s">' + esc(sub) + '</div></div>';

    // --- カレンダー ---
    var days = {}, lo = null, hi = null;
    info.forEach(function (x) {
      if (!x.d) return;
      var k = dkey(x.d), o = days[k] || (days[k] = { all: false, wait: false, tri: false });
      if (x.all) o.all = true;
      if (x.wait) o.wait = true;
      if (x.tri) o.tri = true;
      var day = new Date(x.d.getFullYear(), x.d.getMonth(), x.d.getDate());
      if (!lo || day < lo) lo = day;
      if (!hi || day > hi) hi = day;
    });
    var calCard = document.getElementById('calCard');
    calCard.classList.toggle('hidden', !lo);
    if (lo) {
      var from = new Date(lo.getFullYear(), lo.getMonth(), lo.getDate() - lo.getDay());
      var to = new Date(hi.getFullYear(), hi.getMonth(), hi.getDate() + (6 - hi.getDay()));
      var multi = lo.getMonth() !== hi.getMonth() || lo.getFullYear() !== hi.getFullYear();
      document.getElementById('calTitle').textContent = multi ? (lo.getMonth() + 1) + '月〜' + (hi.getMonth() + 1) + '月 · みんなの重なり' : (lo.getMonth() + 1) + '月 · みんなの重なり';
      var today = dkey(new Date()), html = '', first = true;
      for (var c = new Date(from.getTime()); c <= to; c.setDate(c.getDate() + 1)) {
        var k = dkey(c), o = days[k], isToday = k === today;
        var newMonth = multi && !first && c.getDate() === 1;
        var num = newMonth ? (c.getMonth() + 1) + '/1' : c.getDate();
        first = false;
        var numHtml = '<i class="cn' + (newMonth ? ' long' : '') + '">' + num + '</i>';
        if (o) {
          var st = o.all ? ['all', '全員○'] : o.wait ? ['wait', 'まだ'] : o.tri ? ['tri', '△'] : ['none', 'なし'];
          html += '<a class="cd s-' + st[0] + (isToday ? ' today' : '') + '" href="#d-' + k + '" aria-label="' + (c.getMonth() + 1) + '月' + c.getDate() + '日(' + WD[c.getDay()] + ') ' + st[1] + '">' + numHtml + '<b class="cc">' + st[1] + '</b></a>';
        } else {
          html += '<span class="cd' + (isToday ? ' today' : '') + '">' + numHtml + '<b class="cc"></b></span>';
        }
      }
      document.getElementById('calGrid').innerHTML = html;
    }

    // --- 候補リスト（日付ごと） ---
    var groups = [], gmap = {};
    info.forEach(function (x) {
      var p = parts(x.slot), gk = x.d ? dkey(x.d) : 'x:' + (p ? p.date : x.slot.label);
      var g = gmap[gk];
      if (!g) { g = gmap[gk] = { id: x.d ? 'd-' + gk : '', head: p ? p.date : x.slot.label, rows: [] }; groups.push(g); }
      var pills = names.map(function (n, i) {
        var m = x.marks[i], cls = m === '○' ? 'o' : m === '△' ? 't' : m === '×' ? 'x' : 'n';
        return '<span class="pill" aria-label="' + esc(n) + ' ' + (m || '未回答') + '"><i class="pc' + (n === myName ? ' me' : '') + '">' + esc(n.charAt(0)) + '</i><span class="pm ' + cls + '">' + (m || '…') + '</span></span>';
      }).join('');
      var seg = [['○', 'ok'], ['△', 'tri'], ['×', 'no']].map(function (pair) {
        var on = myMarks[x.slot.key] === pair[0];
        return '<button type="button" class="' + pair[1] + (on ? ' on' : '') + '" data-i="' + x.idx + '" data-m="' + pair[0] + '" aria-pressed="' + on + '" aria-label="' + esc(slotLabel(x.slot)) + ' ' + pair[0] + '">' + pair[0] + '</button>';
      }).join('');
      g.rows.push('<div class="srow' + (x.all ? ' all' : '') + '"><div class="sl"><div class="st">' + esc(p ? p.time : x.slot.label) + '</div><div class="pills">' + pills + '</div></div><div class="seg">' + seg + '</div></div>');
    });
    var box = document.getElementById('slots');
    box.innerHTML = groups.map(function (g) {
      return '<div class="grp"' + (g.id ? ' id="' + g.id + '"' : '') + '>' + esc(g.head) + '</div>' + g.rows.join('');
    }).join('');
    if (!box.dataset.wired) {
      box.dataset.wired = '1';
      box.addEventListener('click', function (e) {
        var b = e.target, m = b && b.getAttribute && b.getAttribute('data-m');
        if (!m) return;
        var slot = EVENT.slots[+b.getAttribute('data-i')];
        if (!slot) return;
        if (!myName) { toast('先に名前を選んでください'); document.getElementById('whoText').focus(); return; }
        myMarks[slot.key] = m;
        renderBoard();
        checkSave();
      });
    }
  }

  function prefill() {
    VOTES.forEach(function (v) {
      if (v.name !== myName) return;
      myMarks[v.slotKey] = v.mark;
      if (v.comment) document.getElementById('comment').value = v.comment;
    });
  }

  function checkSave() {
    var all = EVENT.slots.every(function (s) { return myMarks[s.key]; });
    var ok = !!(myName && all);
    var n = EVENT.slots.filter(function (s) { return myMarks[s.key]; }).length, total = EVENT.slots.length;
    document.getElementById('saveBtn').disabled = !ok;
    document.getElementById('cnt').textContent = n;
    document.getElementById('cntTot').textContent = ' / ' + total;
    document.getElementById('barFill').style.width = (total ? Math.round(n / total * 100) : 0) + '%';
  }

  function renderList(votes) {
    VOTES = votes || [];
    var names = [];
    VOTES.forEach(function (v) { if (v.name && names.indexOf(v.name) === -1) names.push(v.name); });
    EVENT.participants.forEach(function (n) { if (names.indexOf(n) === -1) names.push(n); });
    var pending = EVENT.participants.filter(function (n) { return !VOTES.some(function (v) { return v.name === n; }); });
    document.getElementById('pending').textContent = pending.length ? '未回答: ' + pending.join('、') : '全員回答済み';

    var rows = computeMatrix(VOTES, names, EVENT.slots);
    var html = '<table><thead><tr><th class="l">候補</th>';
    names.forEach(function (n) { html += '<th' + (n === myName ? ' class="me"' : '') + '>' + esc(n) + '</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      var slot = EVENT.slots.filter(function (s) { return s.key === r.key; })[0];
      var p = parts(slot);
      html += '<tr' + (r.allOk ? ' class="all"' : '') + '><td class="l">' + (p ? esc(p.date) + '<small>' + esc(p.time) + '</small>' : esc(slot.label)) + (r.allOk ? '<span class="badge">全員○</span>' : '') + '</td>';
      r.cells.forEach(function (c) {
        var cls = c.mark === '○' ? 'o' : c.mark === '△' ? 't' : c.mark === '×' ? 'x' : 'n';
        html += '<td class="' + cls + '">' + (c.mark || '－') + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('matrix').innerHTML = html;
    renderBoard();
  }

  // 全員そろった時のカード。summary は API の返却をそのまま使う（表側で再計算しない）
  function renderComplete(sum) {
    SUMMARY = sum || null;
    var box = document.getElementById('completeBox');
    if (!SUMMARY || !SUMMARY.allAnswered || EVENT.status !== 'open') { box.classList.add('hidden'); return; }
    var html;
    if (SUMMARY.allOk.length) {
      html = SUMMARY.allOk.map(function (s) { return '<div class="ok-line">' + esc(s.label) + '</div>'; }).join('');
    } else {
      html = '<div class="ok-none">全員○の枠はありません</div>';
      if (SUMMARY.okOrMaybe.length) html += '<div class="ok-none">△を含めると: ' + esc(joinLabels(SUMMARY.okOrMaybe)) + '</div>';
    }
    document.getElementById('completeBody').innerHTML = html;
    box.classList.remove('hidden');
  }

  function joinLabels(arr) { return arr.map(function (s) { return s.label; }).join(' / '); }

  function completeText() {
    var lines = ['【' + EVENT.title + '】全員の回答がそろいました'];
    if (SUMMARY.allOk.length) {
      lines.push('全員○: ' + joinLabels(SUMMARY.allOk));
    } else {
      lines.push('全員○の枠はありません');
      if (SUMMARY.okOrMaybe.length) lines.push('△を含めると: ' + joinLabels(SUMMARY.okOrMaybe));
    }
    lines.push(location.href);
    return lines.join('\n');
  }

  function copyResult() {
    var text = completeText();
    var done = function () { toast('コピーしました'); };
    var fallback = function () { legacyCopy(text) ? done() : toast('コピーできませんでした'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  // clipboard API が使えない環境（古いSafari / iframe内）用
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 2000);
  }

  // GASは302→script.googleusercontent.com へ飛んでそこでCORSが付く。
  // headersを付けるとプリフライトが飛んで落ちるので Content-Type は付けない
  function post(payload) {
    return fetch(window.ITSUNARA_API, { method: 'POST', body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); });
  }

  function save() {
    var btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = '送信中';
    post({ action: 'submit', id: EVENT.id, name: myName, marks: myMarks, comment: document.getElementById('comment').value })
      .then(function (res) {
        btn.textContent = '送信する';
        if (res && res.ok) { renderList(res.votes); renderComplete(res.summary); toast('送信しました'); }
        else toast('送信できませんでした');
        checkSave();
      })
      .catch(function () {
        btn.textContent = '送信する';
        btn.disabled = false;
        toast('通信エラー');
      });
  }

  function message(text) {
    hideSkeleton();
    var b = document.getElementById('closedBox');
    b.textContent = text;
    b.classList.remove('hidden');
  }

  function hideSkeleton() {
    var sk = document.getElementById('skeleton');
    if (sk) sk.remove();
  }

  // 前回この端末で見た内容。あれば即座に描いて、裏で最新を取り直す。
  // GAS は速くても1秒前後かかるので、2回目以降は待ち時間ゼロで中身が出る。
  function cacheKey(id) { return 'itsunara:v1:' + id; }

  function readCache(id) {
    try { return JSON.parse(localStorage.getItem(cacheKey(id)) || 'null'); } catch (e) { return null; }
  }

  function writeCache(id, res) {
    try { localStorage.setItem(cacheKey(id), JSON.stringify(res)); } catch (e) { /* 容量超過や無効化は無視 */ }
  }

  // fetch には既定の制限時間が無い。返ってこないと骨組みのまま永遠に待つので必ず切る。
  function fetchEvent(id, ms) {
    var ctl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, ms);
    var opt = ctl ? { signal: ctl.signal } : {};
    return fetch(window.ITSUNARA_API + '?api=event&id=' + encodeURIComponent(id), opt)
      .then(function (r) { return r.json(); })
      .then(function (res) { clearTimeout(timer); return res; },
            function (err) { clearTimeout(timer); throw err; });
  }

  function failed(hadContent) {
    if (hadContent) return;               // 古い内容が出ているなら黙って諦める
    hideSkeleton();
    var b = document.getElementById('closedBox');
    b.innerHTML = '';
    b.appendChild(document.createTextNode('読み込めませんでした。電波の良いところでもう一度お試しください。'));
    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.type = 'button';
    btn.style.marginTop = '12px';
    btn.textContent = 'もう一度読み込む';
    btn.onclick = function () { location.reload(); };
    b.appendChild(document.createElement('br'));
    b.appendChild(btn);
    b.classList.remove('hidden');
  }

  function boot() {
    var id = (location.search.match(/[?&]id=([^&]*)/) || [])[1] || '';
    if (!id) { message('この調整は見つかりません'); return; }
    id = decodeURIComponent(id);

    // 描画は3つの供給元から。速報（端末の記録・発行時のスナップショット）で先に絵を出し、
    // GAS から本物が届いたら必ず上書きする。速報が本物を上書きすることは無い。
    var live = false;   // GAS の結果を描いたか
    var shown = false;  // 何かしら描いたか

    function render(res, isLive) {
      if (!res || !res.ok || !res.event) return;
      if (!isLive && shown) return;          // 速報は空の画面を埋めるときだけ
      hideSkeleton();
      EVENT = res.event;
      // 名前を入れて記入中なら画面を作り直さず、表だけ静かに更新する
      if (shown && myName) { renderList(res.votes || []); renderComplete(res.summary); }
      else { start(res.votes || [], res.summary); }
      shown = true;
      if (isLive) { live = true; writeCache(id, res); }
    }

    render(readCache(id), false);            // ① 前にこの端末で見た内容

    fetch('./e/' + encodeURIComponent(id) + '.json')   // ② 発行時のスナップショット(GitHub Pages・15ms)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (res) { render(res, false); })
      .catch(function () { /* 無ければGASを待つだけ */ });

    function fromGas(res) {                  // ③ 本物
      if (!res || !res.ok || !res.event) {
        if (!shown) { hideSkeleton(); message('この調整は見つかりません'); }
        return;
      }
      render(res, true);
    }

    fetchEvent(id, 12000)
      .then(fromGas)
      .catch(function () { return fetchEvent(id, 12000).then(fromGas); })
      .catch(function () { failed(shown); });
  }

  function start(votes, summary) {
    if (EVENT.status === 'closed') { message('この調整は終了しました'); return; }
    document.title = 'いつなら？｜' + EVENT.title;
    document.getElementById('main').classList.remove('hidden');
    document.getElementById('title').textContent = EVENT.title;
    renderMeta();
    renderNote();

    if (EVENT.status === 'decided') {
      var d = EVENT.decided || {};
      var slot = EVENT.slots.filter(function (s) { return s.key === d.slotKey; })[0] || { label: d.label || '' };
      var p = parts(slot);
      document.getElementById('listBox').classList.remove('hidden');
      document.getElementById('decidedBox').classList.remove('hidden');
      document.getElementById('decidedWhen').innerHTML = p ? esc(p.date) + '<small>' + esc(p.time) + '</small>' : esc(d.label || slot.label || '');
      if (d.url) { var a = document.getElementById('decidedLink'); a.href = d.url; a.classList.remove('hidden'); }
      var cal = slot.start && slot.end && typeof gcalUrl === 'function' ? gcalUrl(EVENT.title, slot.start, slot.end, location.href + (d.url ? '\n' + d.url : ''), d.url || '') : '';
      if (cal) { var ca = document.getElementById('decidedCal'); ca.href = cal; ca.classList.remove('hidden'); }
    } else {
      document.getElementById('voteArea').classList.remove('hidden');
      renderWho();
      document.getElementById('saveBtn').onclick = save;
    }

    document.getElementById('copyBtn').onclick = copyResult;
    renderList(votes);
    renderComplete(summary);
    if (EVENT.status !== 'decided') checkSave();
  }

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function () {}); }
  boot();
</script>
</body>
